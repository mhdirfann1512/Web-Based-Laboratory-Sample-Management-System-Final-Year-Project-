<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sample Storage System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar container">
            <a href="/" class="logo">SampleStorage</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/login">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="auth-container card">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your email or phone number to receive an OTP</p>
            </div>
            
            <div id="message" class="alert" style="display: none;"></div>
            
            <form id="forgotPasswordForm" action="/forgot-password" method="POST">
                <div class="form-group">
                    <label for="userType">Account Type:</label>
                    <select id="userType" name="userType" class="form-control" required>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="contactMethod">Reset via:</label>
                    <select id="contactMethod" name="contactMethod" class="form-control" required>
                        <option value="email">Email</option>
                        <option value="phone">Phone Number</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="contact" id="contactLabel">Email:</label>
                    <input type="text" id="contact" name="contact" class="form-control" required>
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Send OTP</button>
            </form>
            
            <div class="text-center mt-3">
                <p>Remember your password? <a href="/login" class="link">Login here</a></p>
                <p><a href="/" class="link">Back to Home</a></p>
            </div>
        </div>
    </main>

    <script>
        // Update label and input type based on contact method
        document.getElementById('contactMethod').addEventListener('change', function() {
            const contactLabel = document.getElementById('contactLabel');
            const contactInput = document.getElementById('contact');
            
            if (this.value === 'email') {
                contactLabel.textContent = 'Email:';
                contactInput.type = 'email';
                contactInput.placeholder = 'Enter your email';
            } else {
                contactLabel.textContent = 'Phone Number:';
                contactInput.type = 'tel';
                contactInput.placeholder = 'Enter your phone number';
            }
        });

        // Prevent double submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            // Re-enable after 5 seconds in case of error
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send OTP';
            }, 5000);
        });
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
