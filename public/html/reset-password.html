<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sample Storage System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar container">
            <a href="/" class="logo">SampleStorage</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/login">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="auth-container card">
            <div class="auth-header">
                <h2>Create New Password</h2>
                <p>Enter your new password</p>
            </div>
            
            <div id="message" class="alert" style="display: none;"></div>
            
            <form id="resetPasswordForm" action="/reset-password" method="POST">
                <input type="hidden" id="email" name="email" value="">
                <input type="hidden" id="userType" name="userType" value="">
                
                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                    <small class="form-text">Password must be at least 8 characters long</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </form>
            
            <div class="text-center mt-3">
                <p><a href="/login" class="link">Back to Login</a></p>
            </div>
        </div>
    </main>

    <script>
        // Get email and type from URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const userType = urlParams.get('type');
        
        if (email && userType) {
            document.getElementById('email').value = email;
            document.getElementById('userType').value = userType;
        }

        // Password confirmation validation
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                showMessage('Passwords do not match!');
                return false;
            }
            
            if (newPassword.length < 8) {
                e.preventDefault();
                showMessage('Password must be at least 8 characters long!');
                return false;
            }
        });
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
