<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispose Sample - Sample Storage System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dispose-container {
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .search-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .search-bar {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1.1rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: white;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .search-results {
            margin-top: 2rem;
        }

        .sample-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sample-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.1);
        }

        .sample-card.disposable {
            border-left: 4px solid var(--success-color);
        }

        .sample-card.not-disposable {
            border-left: 4px solid var(--danger-color);
            opacity: 0.7;
            cursor: not-allowed;
        }

        .sample-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .sample-id {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-disposed {
            background: #fee2e2;
            color: #991b1b;
        }

        .sample-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .sample-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-dispose {
            background: var(--danger-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-dispose:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .btn-dispose:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-view {
            background: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-view:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .modal-body {
            padding: 1.5rem 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--background-light);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .warning-box {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .warning-box i {
            color: #d97706;
            margin-right: 0.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-cancel {
            background: var(--text-secondary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #6b7280;
        }

        .btn-confirm {
            background: var(--danger-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover:not(:disabled) {
            background: #dc2626;
        }

        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .sample-details {
                grid-template-columns: 1fr;
            }

            .sample-actions {
                flex-direction: column;
            }

            .modal-content {
                margin: 2% auto;
                width: 95%;
            }

            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="/" class="logo">SampleStorage</a>
                <div class="nav-links">
                    <span class="user-info">
                        <i class="fas fa-user-circle" id="userIcon"></i>
                        <span id="userName">Loading...</span>
                    </span>
                    <a href="#" class="nav-link" id="dashboardLink">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="/profile" class="nav-link">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a href="/logout" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="dispose-container">
            <div class="page-header">
                <h1><i class="fas fa-trash-alt"></i> Dispose Sample</h1>
            </div>

            <div id="message" class="alert" style="display: none;"></div>

            <!-- Search Section -->
            <div class="search-section card">
                <h3 style="margin: 0 0 1.5rem 0; color: var(--primary-color);">
                    
                </h3>
                
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="Enter Sample ID, Patient Name, or Patient ID to search...">
                </div>

                <div class="search-results" id="searchResults">
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>Search for Samples</h3>
                        <p>Enter a Sample ID, Patient Name, or Patient ID above to find samples that can be disposed.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Disposal Confirmation Modal -->
    <div id="disposalModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-exclamation-triangle"></i> Confirm Sample Disposal
                </h2>
                <span class="close" onclick="closeDisposalModal()">&times;</span>
            </div>
            
            <div class="warning-box">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>Warning:</strong> This action cannot be undone. Once disposed, the sample cannot be recovered.
            </div>

            <div id="sampleInfo">
                <!-- Sample information will be loaded here -->
            </div>

            <form id="disposalForm">
                <div class="form-group">
                    <label for="disposalReason">Disposal Reason *</label>
                    <select id="disposalReason" required>
                        <option value="">Select a reason...</option>
                        <option value="Expired">Sample Expired</option>
                        <option value="Contaminated">Sample Contaminated</option>
                        <option value="Testing Complete">Testing Complete</option>
                        <option value="Insufficient Volume">Insufficient Volume</option>
                        <option value="Patient Request">Patient Request</option>
                        <option value="Storage Issue">Storage Issue</option>
                        <option value="Quality Control">Quality Control</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="disposalNotes">Additional Notes (Optional)</label>
                    <textarea id="disposalNotes" 
                              placeholder="Enter any additional information about the disposal..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeDisposalModal()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn-confirm" id="confirmDisposal">
                        <i class="fas fa-trash"></i> Confirm Disposal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;
        let searchResults = [];
        let selectedSample = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserProfile();
            setupEventListeners();
        });

        async function loadUserProfile() {
            try {
                const response = await fetch('/api/profile');
                if (!response.ok) throw new Error('Failed to load profile');
                
                currentUser = await response.json();
                
                // Update UI based on user type
                document.getElementById('userName').textContent = currentUser.full_name || 'User';
                
                if (currentUser.staff_id) {
                    // Staff user
                    document.getElementById('userIcon').className = 'fas fa-user-circle';
                    document.getElementById('dashboardLink').href = '/staff-dashboard';
                } else {
                    // Admin user
                    document.getElementById('userIcon').className = 'fas fa-user-shield';
                    document.getElementById('dashboardLink').href = '/admin-dashboard';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                window.location.href = '/login';
            }
        }

        function setupEventListeners() {
            // Search input with debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length >= 2) {
                    searchTimeout = setTimeout(() => searchSamples(query), 300);
                } else {
                    showEmptyState();
                }
            });

            // Disposal form submission
            document.getElementById('disposalForm').addEventListener('submit', handleDisposal);

            // Close modal when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === document.getElementById('disposalModal')) {
                    closeDisposalModal();
                }
            });
        }

        async function searchSamples(query) {
            const resultsContainer = document.getElementById('searchResults');
            
            // Show loading state
            resultsContainer.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Searching samples...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/samples');
                if (!response.ok) throw new Error('Failed to fetch samples');
                
                const allSamples = await response.json();
                
                // Filter samples based on search query
                searchResults = allSamples.filter(sample => 
                    sample.sample_id.toLowerCase().includes(query.toLowerCase()) ||
                    sample.patient_name.toLowerCase().includes(query.toLowerCase()) ||
                    sample.patient_id.toLowerCase().includes(query.toLowerCase())
                );

                displaySearchResults();
                
            } catch (error) {
                console.error('Error searching samples:', error);
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Search Error</h3>
                        <p>Unable to search samples. Please try again.</p>
                    </div>
                `;
            }
        }

        function displaySearchResults() {
            const resultsContainer = document.getElementById('searchResults');
            
            if (searchResults.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No Samples Found</h3>
                        <p>No samples match your search criteria. Try a different search term.</p>
                    </div>
                `;
                return;
            }

            const resultsHTML = searchResults.map(sample => {
                const isDisposable = sample.status === 'active';
                const cardClass = isDisposable ? 'disposable' : 'not-disposable';
                
                return `
                    <div class="sample-card ${cardClass}" data-sample-id="${sample.sample_id}">
                        <div class="sample-header">
                            <span class="sample-id">${sample.sample_id}</span>
                            <span class="status-badge status-${sample.status}">${sample.status}</span>
                        </div>
                        
                        <div class="sample-details">
                            <div class="detail-item">
                                <span class="detail-label">Patient Name</span>
                                <span class="detail-value">${sample.patient_name}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Patient ID</span>
                                <span class="detail-value">${sample.patient_id}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Sample Type</span>
                                <span class="detail-value">${sample.sample_type_name || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Collection Date</span>
                                <span class="detail-value">${formatDate(sample.collection_date)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Storage Location</span>
                                <span class="detail-value">${sample.storage_name || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Freezer</span>
                                <span class="detail-value">${sample.freezer_name || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="sample-actions">
                            <button class="btn-view" onclick="viewSampleDetails('${sample.sample_id}')">
                                <i class="fas fa-eye"></i> View Details
                            </button>
                            ${isDisposable ? `
                                <button class="btn-dispose" onclick="openDisposalModal('${sample.sample_id}')">
                                    <i class="fas fa-trash"></i> Dispose Sample
                                </button>
                            ` : `
                                <button class="btn-dispose" disabled title="Sample is already ${sample.status}">
                                    <i class="fas fa-ban"></i> Cannot Dispose
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            resultsContainer.innerHTML = `
                <h4 style="margin-bottom: 1rem; color: var(--text-primary);">
                    Found ${searchResults.length} sample(s)
                </h4>
                ${resultsHTML}
            `;
        }

        function showEmptyState() {
            document.getElementById('searchResults').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <h3>Search for Samples</h3>
                    <p>Enter a Sample ID, Patient Name, or Patient ID above to find samples that can be disposed.</p>
                </div>
            `;
        }

// Update the modal structure in the openDisposalModal function
        function openDisposalModal(sampleId) {
            selectedSample = searchResults.find(s => s.sample_id === sampleId);
            if (!selectedSample) return;

            // Update the modal content structure
            const modalContent = document.querySelector('#disposalModal .modal-content');
            modalContent.innerHTML = `
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="fas fa-exclamation-triangle"></i> Confirm Sample Disposal
            </h2>
            <span class="close" onclick="closeDisposalModal()">&times;</span>
        </div>
        
        <div class="modal-body">
            <div class="warning-box">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>Warning:</strong> This action cannot be undone. Once disposed, the sample cannot be recovered.
            </div>

            <div style="background: var(--background-light); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
                <h4 style="margin: 0 0 0.5rem 0; color: var(--primary-color);">Sample Information</h4>
                <p><strong>Sample ID:</strong> ${selectedSample.sample_id}</p>
                <p><strong>Patient:</strong> ${selectedSample.patient_name} (${selectedSample.patient_id})</p>
                <p><strong>Type:</strong> ${selectedSample.sample_type_name || 'N/A'}</p>
                <p><strong>Collection Date:</strong> ${formatDate(selectedSample.collection_date)}</p>
            </div>

            <form id="disposalForm">
                <div class="form-group">
                    <label for="disposalReason">Disposal Reason *</label>
                    <select id="disposalReason" required>
                        <option value="">Select a reason...</option>
                        <option value="Expired">Sample Expired</option>
                        <option value="Contaminated">Sample Contaminated</option>
                        <option value="Testing Complete">Testing Complete</option>
                        <option value="Insufficient Volume">Insufficient Volume</option>
                        <option value="Patient Request">Patient Request</option>
                        <option value="Storage Issue">Storage Issue</option>
                        <option value="Quality Control">Quality Control</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="disposalNotes">Additional Notes (Optional)</label>
                    <textarea id="disposalNotes" 
                              placeholder="Enter any additional information about the disposal..."></textarea>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeDisposalModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="button" class="btn-confirm" id="confirmDisposal" onclick="handleDisposalClick()">
                    <i class="fas fa-trash"></i> Confirm Disposal
                </button>
            </div>
        </div>
    `;

    // Show modal
    document.getElementById('disposalModal').style.display = 'block';
    
    // Re-attach form event listener
    document.getElementById('disposalForm').addEventListener('submit', handleDisposal);
}

function handleDisposalClick() {
    const form = document.getElementById('disposalForm');
    const event = new Event('submit');
    form.dispatchEvent(event);
}

        function closeDisposalModal() {
            document.getElementById('disposalModal').style.display = 'none';
            selectedSample = null;
        }

        async function handleDisposal(e) {
            e.preventDefault();
            
            if (!selectedSample) return;

            const reason = document.getElementById('disposalReason').value;
            const notes = document.getElementById('disposalNotes').value;

            if (!reason) {
                showMessage('Please select a disposal reason', true);
                return;
            }

            const confirmButton = document.getElementById('confirmDisposal');
            confirmButton.disabled = true;
            confirmButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Disposing...';

            try {
                const response = await fetch(`/api/samples/${selectedSample.sample_id}/dispose`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason, notes })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to dispose sample');
                }

                const result = await response.json();
                
                showMessage(`Sample ${selectedSample.sample_id} has been disposed successfully`, false);
                closeDisposalModal();
                
                // Refresh search results
                const searchQuery = document.getElementById('searchInput').value.trim();
                if (searchQuery.length >= 2) {
                    await searchSamples(searchQuery);
                }

            } catch (error) {
                console.error('Error disposing sample:', error);
                showMessage('Error disposing sample: ' + error.message, true);
            } finally {
                confirmButton.disabled = false;
                confirmButton.innerHTML = '<i class="fas fa-trash"></i> Confirm Disposal';
            }
        }

        function viewSampleDetails(sampleId) {
            // Redirect to view samples page with the specific sample
            window.location.href = `/view-samples?sample=${sampleId}`;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function showMessage(message, isError = true) {
            const messageDiv = document.getElementById('message');
            if (!messageDiv) return;

            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            messageDiv.className = isError ? 'alert alert-error' : 'alert alert-success';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
